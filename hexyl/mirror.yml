extends: ../mirror-base.yml

name: hexyl

# Logical index package `sharkdp/hexyl` at the physical path
# `ghcr.io/ocx-contrib/sharkdp/hexyl` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/sharkdp/hexyl

source:
  type: github_release
  owner: sharkdp
  repo: hexyl
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# hexyl is a cargo-dist Rust build and, like hyperfine (and UNLIKE bat and fd in
# this same repo), upstream's Linux matrix is ASYMMETRIC PER ARCH: x86_64 gets
# both a gnu and a musl build, aarch64 gets ONLY the gnu one. Measured on
# v0.17.0 and re-checked on v0.16.0 and v0.15.0 — the whole in-range set:
#
#   $ file hexyl-v0.17.0-x86_64-unknown-linux-musl/hexyl
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, not stripped
#   $ readelf -l … | grep -c INTERP   → 0
#   $ readelf -d … | grep NEEDED      → (none)
#   (identical on v0.16.0 and v0.15.0)
#
#   $ file hexyl-v0.17.0-aarch64-unknown-linux-gnu/hexyl
#   ELF 64-bit LSB pie executable, ARM aarch64, dynamically linked,
#     interpreter /lib/ld-linux-aarch64.so.1, for GNU/Linux 3.7.0
#   $ readelf -d … | grep NEEDED      → libgcc_s.so.1 libpthread.so.0 libc.so.6
#   $ readelf -V … | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
#     → GLIBC_2.17  (v0.16.0/v0.17.0), GLIBC_2.18 (v0.15.0)
#
# `os.features` states what the artifact REQUIRES OF THE HOST, so the two Linux
# keys differ:
#
#   linux/amd64            — the musl asset needs nothing → BARE key. Tagging a
#                            static build `+libc.musl` would be a false
#                            requirement that hides it from every glibc host.
#                            Picked over x86_64-unknown-linux-gnu, which is
#                            dynamic (PT_INTERP /lib64/ld-linux-x86-64.so.2,
#                            NEEDED libgcc_s.so.1 libpthread.so.0 libc.so.6,
#                            max GLIBC_2.16) and would only cover glibc hosts.
#   linux/arm64+libc.glibc — NO aarch64 musl asset exists upstream, on ANY
#                            in-range release. Absence confirmed against the
#                            full 18/19-asset listing of each, not assumed:
#                            `arm-unknown-linux-musleabihf` is 32-bit armv7,
#                            not arm64. The only aarch64 Linux build is the gnu
#                            one and it is dynamically glibc-linked, so arm64
#                            cannot be made bare. The glibc floor it needs
#                            (2.18) is cleared by ubuntu:24.04 and fedora:40
#                            (both 2.39).
#
# Container legs follow from what each key claims — see `platforms:` below:
# ubuntu + alpine + fedora for the bare amd64 key (the ALPINE LEG IS the
# universality proof), ubuntu + fedora and NO alpine for the glibc arm64 key
# (the binary genuinely cannot load under musl, and the renderer rejects an
# alpine leg on a glibc key at exit 65).
#
# ─── Scope (verified BOTH ways on v0.15.0, v0.16.0 and v0.17.0 — the whole
#     in-range set) ────────────────────────────────────────────────────────────
#
# Each pattern below was grepped against the FULL asset list of every in-range
# release. Every one matched EXACTLY ONE asset, except `darwin/arm64` on
# v0.15.0, which matched zero — handled by a per-platform `min_version` rather
# than a global floor bump (see `platforms:`). A pattern matching zero is
# SILENTLY SKIPPED, not an error, so this check is the only thing standing
# between a typo and a green run with a missing platform.
#
# ⚠️ NO `windows/arm64`. Upstream ships x86_64-pc-windows-msvc and the 32-bit
# i686-pc-windows-msvc and nothing else — there is no aarch64 Windows asset on
# any release. bat, in this same repo, DOES have one from v0.26.0; hexyl's
# coverage is narrower than its sibling's and parity must not be assumed.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   *-x86_64-unknown-linux-gnu               — superseded by the static musl build
#   *-i686-{unknown-linux-{gnu,musl},pc-windows-msvc}   — 32-bit x86
#   *-arm-unknown-linux-{gnueabihf,musleabihf}          — 32-bit ARM
#   hexyl{,-musl}_<ver>_*.deb                           — installers
#
# ⚠️ v0.15.0 AND v0.16.0 also shipped `hexyl-v<ver>-x86_64-pc-windows-gnu.zip`,
# which v0.17.0 dropped. The anchored `-msvc\.zip$` pattern excludes it on the
# two releases where it exists; a looser `-x86_64-pc-windows.*\.zip$` would have
# matched TWO assets on each and failed both versions with an ambiguity error.
# A separate windows-gnu platform is NOT declared for the mirror image of the
# same reason: it would match zero on v0.17.0 and every release after it.
assets:
  linux/amd64:
    - "^hexyl-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  "linux/arm64+libc.glibc":
    - "^hexyl-v.*-aarch64-unknown-linux-gnu\\.tar\\.gz$"
  darwin/amd64:
    - "^hexyl-v.*-x86_64-apple-darwin\\.tar\\.gz$"
  # v0.16.0 and later only — see this platform's `min_version` in `platforms:`.
  darwin/arm64:
    - "^hexyl-v.*-aarch64-apple-darwin\\.tar\\.gz$"
  # Pass 3 — windows.
  # windows/amd64:
  #   - "^hexyl-v.*-x86_64-pc-windows-msvc\\.zip$"

# ../mirror-base.yml sets `build_timestamp: none`, and that is a HYPERFINE
# legacy: `ocx.sh/hyperfine` had already published every in-range version at the
# bare tag before the grouped layout, so switching it to `date` would re-tag all
# of them for no gain. hexyl has no published history, so none of that applies
# and the fleet rule stands — a cascade tag re-points on every re-publish, and
# without a build segment the new manifest reuses the bare version tag and
# orphans the prior digest for registry GC, breaking any `@sha256:` pin in a
# consumer's `ocx.lock`. (Safe as a plain scalar: the shallow-merge hazard only
# bites block-valued keys like `platforms:`.) The documented exception — a
# version that already carries semver build metadata, where `date` empties the
# mirror — does not apply: hexyl's versions are plain `0.17.0`.
build_timestamp: date

asset_type:
  # Every asset — the four tarballs AND the Windows zip — wraps its payload in a
  # single `hexyl-v<ver>-<triple>/` directory, so one strip serves all five
  # platforms and no per-platform override is needed. Verified by `tar tzf` /
  # `unzip -l` on linux, darwin and windows samples of v0.17.0, and by `tar tzf`
  # on v0.16.0 and v0.15.0. After the strip the executable sits at the content
  # root beside CHANGELOG.md, LICENSE-APACHE, LICENSE-MIT, README.md and
  # hexyl.1 — which is why PATH is a bare ${installPath} and `bin_scan` is `off`
  # (see ../mirror-base.yml). Unlike bat/fd/hyperfine, hexyl ships no
  # `autocomplete/` directory; the completions are generated on demand by
  # `hexyl --completion <shell>`.
  type: archive
  strip_components: 1

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  min: "0.15.0"
  new_per_run: 10
  poll_interval: "4 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: hexyl/tests/smoke.star

# ─── Platform matrix — RESTATED IN FULL, not merged ─────────────────────────
#
# `extends:` is a SHALLOW merge of top-level keys: setting `platforms:` here
# replaces ../mirror-base.yml's block OUTRIGHT, so it is restated in full.
#
# ⚠️ The reason is NOT a libc disagreement. hexyl's measured facts match the
# base's (hyperfine's) exactly — bare `linux/amd64`, `linux/arm64+libc.glibc`,
# same container legs, no `windows/arm64`. What cannot be expressed without
# restating is the per-platform `min_version` on `darwin/arm64` below: there is
# no per-key merge, so adding one line means restating the block.
#
# The alpine leg IS the proof for the bare amd64 key. A bare key claims the
# artifact runs under ANY Linux userland; ubuntu (glibc) + fedora (a different
# glibc vintage) + alpine (musl) is what turns that claim into evidence. Drop
# alpine and the claim is merely asserted.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front. No alpine: the
    # artifact is dynamically glibc-linked and genuinely cannot load under musl,
    # and the renderer rejects that leg on a glibc key at exit 65.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
    # native macos-13 Intel pool is exhausted and deadlocks the push job.
    runner: macos-14
    prefix: ["arch", "-x86_64"]
  darwin/arm64:
    runner: macos-14
    shell: bash
    # `aarch64-apple-darwin.tar.gz` is a NEW asset as of v0.16.0 — absent from
    # v0.15.0, where this platform's pattern matches zero assets. (Measured
    # against the full asset listing of all three in-range releases: v0.15.0 has
    # only x86_64-apple-darwin.) The canonical fix for a late-added platform is
    # a per-platform floor, NOT a global `versions.min` bump: an out-of-window
    # (version, platform) is never resolved, built, tested or pushed, and never
    # reds the run.
    min_version: "0.16.0"
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  # No `windows/arm64` — upstream ships no aarch64 Windows asset (see `assets:`).
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate. `gh api repos/sharkdp/hexyl/license` reports
  # only `Apache-2.0` — it picks one file and the repo root carries both
  # LICENSE-APACHE and LICENSE-MIT. Cargo.toml is authoritative:
  #   $ gh api repos/sharkdp/hexyl/contents/Cargo.toml --jq .content \
  #       | base64 -d | grep '^license'
  #   license = "MIT/Apache-2.0"
  # That is Cargo's deprecated slash spelling of the same dual grant; the
  # canonical SPDX expression is written below. Both LICENSE files ship inside
  # every release archive and are republished with it.
  org.opencontainers.image.licenses: "MIT OR Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: sharkdp/hexyl
  fork: ocx-contrib/index
