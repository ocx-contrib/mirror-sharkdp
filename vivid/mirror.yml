extends: ../mirror-base.yml

name: vivid

# Logical index package `sharkdp/vivid` at the physical path
# `ghcr.io/ocx-contrib/sharkdp/vivid` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/sharkdp/vivid

source:
  type: github_release
  owner: sharkdp
  repo: vivid
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# vivid is a cargo-dist Rust build and, like hexyl and hyperfine (and UNLIKE bat
# and fd in this same repo), upstream's Linux matrix is ASYMMETRIC PER ARCH:
# x86_64 gets both a gnu and a musl build, aarch64 gets ONLY the gnu one.
# Measured on v0.11.1 and re-checked on v0.10.1, the floor:
#
#   $ file vivid-v0.11.1-x86_64-unknown-linux-musl/vivid
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ readelf -l … | grep -c INTERP   → 0
#   $ readelf -d … | grep NEEDED      → (none)
#   (identical on v0.10.1)
#
#   $ file vivid-v0.11.1-aarch64-unknown-linux-gnu/vivid
#   ELF 64-bit LSB pie executable, ARM aarch64, dynamically linked,
#     interpreter /lib/ld-linux-aarch64.so.1, for GNU/Linux 3.7.0, stripped
#   $ readelf -d … | grep NEEDED      → libgcc_s.so.1 libpthread.so.0 libc.so.6
#   $ readelf -V … | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
#     → GLIBC_2.17 (v0.11.1), GLIBC_2.18 (v0.10.1)
#
# `os.features` states what the artifact REQUIRES OF THE HOST, so the two Linux
# keys differ:
#
#   linux/amd64            — the musl asset needs nothing → BARE key. Tagging a
#                            static build `+libc.musl` would be a false
#                            requirement that hides it from every glibc host.
#                            Picked over x86_64-unknown-linux-gnu, which is
#                            dynamic (PT_INTERP /lib64/ld-linux-x86-64.so.2,
#                            NEEDED libgcc_s.so.1 libpthread.so.0 libc.so.6,
#                            max GLIBC_2.16) and would only cover glibc hosts.
#   linux/arm64+libc.glibc — NO aarch64 musl asset exists upstream on any
#                            in-range release; absence confirmed against the
#                            full 18/19-asset listing of each, not assumed
#                            (`arm-unknown-linux-musleabihf` is 32-bit armv7,
#                            not arm64). The only aarch64 Linux build is the gnu
#                            one and it is dynamically glibc-linked, so arm64
#                            cannot be made bare. Its glibc floor (2.18) is
#                            cleared by ubuntu:24.04 and fedora:40 (both 2.39).
#
# Container legs follow from what each key claims — see `platforms:` below:
# ubuntu + alpine + fedora for the bare amd64 key (the ALPINE LEG IS the
# universality proof), ubuntu + fedora and NO alpine for the glibc arm64 key
# (the binary genuinely cannot load under musl, and the renderer rejects an
# alpine leg on a glibc key at exit 65).
#
# ─── Scope (verified BOTH ways on v0.10.1, v0.11.0 and v0.11.1 — the whole
#     in-range set) ────────────────────────────────────────────────────────────
#
# Each pattern below was grepped against the FULL asset list of every in-range
# release; every one matched EXACTLY ONE asset in every release where the
# platform applies. A pattern matching zero is SILENTLY SKIPPED, not an error,
# so this check is the only thing standing between a typo and a green run with
# a missing platform.
#
# ⚠️ v0.11.0 IS A STALE UPSTREAM BUILD AND IS EXCLUDED ON EVERY PLATFORM.
# Its release carries 19 assets all named `vivid-v0.10.1-*` — not a naming
# cosmetic: the binaries inside identify themselves as the OLD version.
# Measured:
#   $ gh api repos/sharkdp/vivid/releases/tags/v0.11.0 --jq '.assets[].name'
#     … vivid-v0.10.1-x86_64-unknown-linux-musl.tar.gz …   (every asset)
#   $ tar xzf <that asset> && ./vivid-v0.10.1-…/vivid --version
#     vivid 0.10.1
# (The byte sizes differ from the real v0.10.1 assets, so they are a distinct
# rebuild — of the same source tree.) Mirroring it would publish a binary
# reporting `0.10.1` under the tag `0.11.0`. Nothing would red: the asset
# patterns match, the archive layout is normal, and a smoke test may not assert
# an exact version by fleet rule — so the mis-labelling is invisible to CI and
# has to be excluded by hand. See the `exclude:` anchor in `platforms:`.
#
# ⚠️ `v0.11.1-pre` is a same-day prerelease published 45 minutes before v0.11.1.
# It is excluded TWICE over, deliberately: `skip_prereleases: true` in
# ../mirror-base.yml reads the API's `prerelease: true` flag, and the anchored
# `^v(\d+\.\d+\.\d+)$` tag pattern rejects the `-pre` suffix on its own. Neither
# is relied on alone.
#
# ⚠️ NO `windows/arm64`. Upstream ships x86_64-pc-windows-{msvc,gnu} and the
# 32-bit i686-pc-windows-msvc and nothing else — there is no aarch64 Windows
# asset on any release.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   *-x86_64-unknown-linux-gnu               — superseded by the static musl build
#   *-x86_64-pc-windows-gnu.zip              — msvc is the canonical Windows build
#   *-i686-{unknown-linux-{gnu,musl},pc-windows-msvc}   — 32-bit x86
#   *-arm-unknown-linux-{gnueabihf,musleabihf}          — 32-bit ARM
#   vivid{,-musl}_<ver>_*.deb                           — installers
#
# The anchored `-msvc\.zip$` is load-bearing: vivid ships
# `x86_64-pc-windows-gnu.zip` in EVERY release (unlike bat and hexyl, which
# retired theirs), so a looser `-x86_64-pc-windows.*\.zip$` would match TWO
# assets on every version and fail them all with an ambiguity error.
assets:
  linux/amd64:
    - "^vivid-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  "linux/arm64+libc.glibc":
    - "^vivid-v.*-aarch64-unknown-linux-gnu\\.tar\\.gz$"
  # Pass 2 — darwin. Uncomment these AND the matching `platforms:` entries
  # together: an unmatched platform self-skips per version but still boots its
  # macos-14 runner and greens having tested nothing, so the platform key is
  # staged too.
  # darwin/amd64:
  #   - "^vivid-v.*-x86_64-apple-darwin\\.tar\\.gz$"
  # darwin/arm64:
  #   - "^vivid-v.*-aarch64-apple-darwin\\.tar\\.gz$"
  # Pass 3 — windows.
  # windows/amd64:
  #   - "^vivid-v.*-x86_64-pc-windows-msvc\\.zip$"

# ../mirror-base.yml sets `build_timestamp: none`, and that is a HYPERFINE
# legacy: `ocx.sh/hyperfine` had already published every in-range version at the
# bare tag before the grouped layout, so switching it to `date` would re-tag all
# of them for no gain. vivid has no published history, so none of that applies
# and the fleet rule stands — a cascade tag re-points on every re-publish, and
# without a build segment the new manifest reuses the bare version tag and
# orphans the prior digest for registry GC, breaking any `@sha256:` pin in a
# consumer's `ocx.lock`. (Safe as a plain scalar: the shallow-merge hazard only
# bites block-valued keys like `platforms:`.) The documented exception — a
# version that already carries semver build metadata, where `date` empties the
# mirror — does not apply: vivid's versions are plain `0.11.1`.
build_timestamp: date

asset_type:
  # Every asset — the tarballs AND the Windows zip — wraps its payload in a
  # single `vivid-v<ver>-<triple>/` directory, so one strip serves all five
  # platforms and no per-platform override is needed. Verified by `tar tzf` /
  # `unzip -l` on linux, darwin and windows samples of v0.11.1 and by `tar tzf`
  # on v0.10.1 and v0.11.0. After the strip the executable sits at the content
  # root beside CHANGELOG.md, LICENSE-APACHE, LICENSE-MIT, README.md and an
  # (empty) autocomplete/ — which is why PATH is a bare ${installPath} and
  # `bin_scan` is `off` (see ../mirror-base.yml).
  #
  # Note what is NOT in the archive: no themes/ and no filetypes.yml. vivid
  # embeds its whole theme set and filetype database in the executable, which
  # is what tests/smoke.star exercises — see the Tier 3 comments there.
  type: archive
  strip_components: 1

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # 0.10.1 is the floor rather than 0.11.0: see the stale-build note above —
  # 0.11.0 is a real release that ships 0.10.1 binaries, and it is dropped by a
  # per-platform `exclude` (the documented lever for a known-broken release)
  # rather than by raising this floor past a version that is genuinely fine.
  min: "0.10.1"
  new_per_run: 10
  poll_interval: "5 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: vivid/tests/smoke.star

# ─── Platform matrix — RESTATED IN FULL, not merged ─────────────────────────
#
# `extends:` is a SHALLOW merge of top-level keys: setting `platforms:` here
# replaces ../mirror-base.yml's block OUTRIGHT, so it is restated in full.
#
# vivid's measured libc facts match the base's (hyperfine's) exactly — bare
# `linux/amd64`, `linux/arm64+libc.glibc`, same container legs, no
# `windows/arm64`. What cannot be expressed without restating is the
# `exclude:` of v0.11.0 and `darwin/arm64`'s `min_version`: there is no per-key
# merge, so adding either means restating the block.
#
# The alpine leg IS the proof for the bare amd64 key. A bare key claims the
# artifact runs under ANY Linux userland; ubuntu (glibc) + fedora (a different
# glibc vintage) + alpine (musl) is what turns that claim into evidence. Drop
# alpine and the claim is merely asserted.
#
# The v0.11.0 exclude is defined once as a YAML anchor on the first platform
# and aliased by every other — `exclude:` is a plain list, so an anchor is the
# only reuse mechanism, and the alternative (five hand-copied blocks) is five
# chances to drop one and silently publish the stale build on that platform.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
    exclude: &exclude_stale_0_11_0
      - version: "0.11.0"
        reason: "upstream released a stale build — every v0.11.0 asset is named vivid-v0.10.1-* and the binary reports `vivid 0.10.1`"
        severity: broken
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front. No alpine: the
    # artifact is dynamically glibc-linked and genuinely cannot load under musl,
    # and the renderer rejects that leg on a glibc key at exit 65.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
    exclude: *exclude_stale_0_11_0
  # Pass 2 — darwin. Uncomment together with the matching `assets:` keys.
  # darwin/amd64:
  #   # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 — GitHub's
  #   # native macos-13 Intel pool is exhausted and deadlocks the push job.
  #   runner: macos-14
  #   prefix: ["arch", "-x86_64"]
  #   exclude: *exclude_stale_0_11_0
  # darwin/arm64:
  #   runner: macos-14
  #   shell: bash
  #   # `aarch64-apple-darwin.tar.gz` first appears in the v0.11.0 RELEASE —
  #   # where, per the stale-build note above, it is misnamed
  #   # `vivid-v0.10.1-aarch64-apple-darwin.tar.gz`. v0.10.1's own release has
  #   # no Apple Silicon asset at all, so without this floor the pattern would
  #   # match zero there and be silently skipped. Combined with the exclude
  #   # below, this platform's effective first version is 0.11.1.
  #   min_version: "0.11.0"
  #   exclude: *exclude_stale_0_11_0
  # Pass 3 — windows.
  # windows/amd64:
  #   runner: windows-latest
  #   shell: pwsh
  #   exclude: *exclude_stale_0_11_0
  # No `windows/arm64` — upstream ships no aarch64 Windows asset (see `assets:`).
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate. `gh api repos/sharkdp/vivid/license` reports
  # only `Apache-2.0` — it picks one file and the repo root carries both
  # LICENSE-APACHE and LICENSE-MIT. Cargo.toml is authoritative:
  #   $ gh api repos/sharkdp/vivid/contents/Cargo.toml --jq .content \
  #       | base64 -d | grep '^license'
  #   license = "MIT/Apache-2.0"
  # That is Cargo's deprecated slash spelling of the same dual grant; the
  # canonical SPDX expression is written below. Both LICENSE files ship inside
  # every release archive and are republished with it.
  org.opencontainers.image.licenses: "MIT OR Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: sharkdp/vivid
  fork: ocx-contrib/index
