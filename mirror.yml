name: hyperfine
target:
  registry: ocx.sh
  repository: hyperfine

source:
  type: github_release
  owner: sharkdp
  repo: hyperfine
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

assets:
  linux/amd64:
    - "hyperfine-.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "hyperfine-.*-aarch64-unknown-linux-gnu\\.tar\\.gz$"
  darwin/amd64:
    - "hyperfine-.*-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "hyperfine-.*-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "hyperfine-.*-x86_64-pc-windows-msvc\\.zip$"

asset_type:
  type: archive
  strip_components: 1

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "1.19.0"
  new_per_run: 10
  poll_interval: "0 */6 * * *"

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  darwin/amd64:
    runner: macos-14
  darwin/arm64:
    runner: macos-14
  windows/amd64:
    runner: windows-latest
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
