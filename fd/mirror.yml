extends: ../mirror-base.yml

name: fd

# Logical index package `sharkdp/fd` at the physical path
# `ghcr.io/ocx-contrib/sharkdp/fd` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/sharkdp/fd

source:
  type: github_release
  owner: sharkdp
  repo: fd
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# fd is a cargo-dist Rust build with the same release matrix as bat: upstream
# ships a musl build for BOTH 64-bit arches, and BOTH are fully static.
# Measured on v10.4.2 and re-checked on v10.4.1, the oldest release in range
# that actually has assets:
#
#   $ file fd-v10.4.2-x86_64-unknown-linux-musl/fd
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ readelf -l … | grep -c INTERP   → 0
#   $ readelf -d … | grep NEEDED      → (none)
#
#   $ file fd-v10.4.2-aarch64-unknown-linux-musl/fd
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#   $ readelf -l … | grep -c INTERP   → 0
#   $ readelf -d … | grep NEEDED      → (none)
#
#   $ file fd-v10.4.1-x86_64-unknown-linux-musl/fd
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ file fd-v10.4.1-aarch64-unknown-linux-musl/fd
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#
# Neither artifact carries a PT_INTERP segment or a single DT_NEEDED entry, so
# neither requires anything of the host userland. `os.features` states what the
# artifact REQUIRES, so both Linux keys are BARE — tagging a static build
# `+libc.musl` would be a false requirement that hides it from every glibc host.
#
# ⚠️ THIS IS WHY `platforms:` IS RESTATED IN FULL BELOW. ../mirror-base.yml
# encodes hyperfine's matrix, where aarch64 has no musl build and therefore
# carries `linux/arm64+libc.glibc` with no alpine leg. fd's aarch64 IS static,
# so it takes a bare key and MUST get the alpine leg — and `extends:` is a
# SHALLOW top-level merge, so a partial restatement would silently drop every
# container leg in the repo-wide block.
#
# The gnu builds are deliberately NOT carried. Both exist and both are
# dynamically linked —
#   $ file fd-v10.4.2-x86_64-unknown-linux-gnu/fd
#   … dynamically linked, interpreter /lib64/ld-linux-x86-64.so.2 …
#   $ readelf -d … | grep NEEDED
#   libgcc_s.so.1 librt.so.1 libpthread.so.0 libdl.so.2 libc.so.6
# — so publishing them alongside the static builds under `+libc.glibc` is legal
# and would resolve correctly by specificity scoring. It buys nothing here: the
# documented reason to carry a second glibc key is behaviour a user can reach
# that musl's libc changes, and the canonical case is DNS/NSS. fd walks the
# local filesystem — it opens no sockets and resolves no names — so the second
# key would be extra artifacts with no reachable difference.
#
# ─── Scope (verified BOTH ways on v10.4.1 and v10.4.2 — every in-range release
#     that has assets) ─────────────────────────────────────────────────────────
#
# Each pattern below was grepped against the FULL 21-asset list of both
# releases; every one matched EXACTLY ONE asset. A pattern matching zero is
# SILENTLY SKIPPED, not an error, so this check is the only thing standing
# between a typo and a green run with a missing platform.
#
# ⚠️ NO `darwin/amd64`. Upstream ships NO x86_64-apple-darwin asset — confirmed
# absent from both v10.4.1 and v10.4.2, i.e. a sustained drop rather than a
# one-release fluke (Intel Mac users are pointed at Homebrew/cargo). Declaring
# it would match zero assets and be silently skipped, producing a green run with
# a platform that never publishes. bat, in this same repo, DOES ship it — the
# two specs legitimately differ here.
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   *-{x86_64,aarch64}-unknown-linux-gnu    — superseded by the static musl builds
#   *-x86_64-pc-windows-gnu.zip             — msvc is the canonical Windows build
#   *-i686-{unknown-linux-{gnu,musl},pc-windows-msvc}   — 32-bit x86
#   *-arm-unknown-linux-{gnueabihf,musleabihf}          — 32-bit ARM
#   fd{,-musl}_<ver>_*.deb                              — installers
#
# The anchored `-msvc\.zip$` matters more here than for bat: fd ships
# `x86_64-pc-windows-gnu.zip` in EVERY release, so a looser
# `-x86_64-pc-windows.*\.zip$` would match TWO assets on every version and fail
# them all with an ambiguity error.
assets:
  linux/amd64:
    - "^fd-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^fd-v.*-aarch64-unknown-linux-musl\\.tar\\.gz$"
  # arm64 ONLY; there is no Intel Mac asset (see above).
  darwin/arm64:
    - "^fd-v.*-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^fd-v.*-x86_64-pc-windows-msvc\\.zip$"
  windows/arm64:
    - "^fd-v.*-aarch64-pc-windows-msvc\\.zip$"

# ../mirror-base.yml sets `build_timestamp: none`, and that is a HYPERFINE
# legacy: `ocx.sh/hyperfine` had already published every in-range version at the
# bare tag before the grouped layout, so switching it to `date` would re-tag all
# of them for no gain. fd has no published history, so none of that applies and
# the fleet rule stands — a cascade tag re-points on every re-publish, and
# without a build segment the new manifest reuses the bare version tag and
# orphans the prior digest for registry GC, breaking any `@sha256:` pin in a
# consumer's `ocx.lock`. (Safe as a plain scalar: the shallow-merge hazard only
# bites block-valued keys like `platforms:`.) The documented exception — a
# version that already carries semver build metadata, where `date` empties the
# mirror — does not apply: fd's versions are plain `10.4.2`.
build_timestamp: date

asset_type:
  # Every asset — the tarballs AND the Windows zips — wraps its payload in a
  # single `fd-v<ver>-<triple>/` directory, so one strip serves all five
  # platforms and no per-platform override is needed. Verified by `tar tzf` /
  # `unzip -l` on linux, darwin and windows samples. After the strip the
  # executable sits at the content root beside CHANGELOG.md, LICENSE-APACHE,
  # LICENSE-MIT, README.md, fd.1 and autocomplete/ — which is why PATH is a bare
  # ${installPath} and `bin_scan` is `off` (see ../mirror-base.yml).
  type: archive
  strip_components: 1

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # ⚠️ v10.4.0 is a real, non-draft, non-prerelease release with release notes
  # and ZERO build assets — upstream superseded it with v10.4.1 the next day
  # after a botched build. The floor is therefore 10.4.1, the oldest release
  # that can actually produce an artifact. This is NOT the "don't bump the
  # global floor to dodge a platform gap" case: 10.4.0 is missing EVERY
  # platform, not one, so there is no per-platform window that would rescue it
  # and nothing to mirror at that version by any route.
  min: "10.4.1"
  new_per_run: 10
  poll_interval: "3 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: fd/tests/smoke.star

# ─── Platform matrix — RESTATED IN FULL, not merged ─────────────────────────
#
# `extends:` is a SHALLOW merge of top-level keys: setting `platforms:` here
# replaces ../mirror-base.yml's block OUTRIGHT. It is restated in full and
# deliberately, for two reasons — fd's aarch64 musl build is static, so
# `linux/arm64` is a BARE key with an ALPINE LEG where the base carries
# `linux/arm64+libc.glibc` and no alpine; and fd has no `darwin/amd64` at all,
# which the base declares.
#
# The alpine leg IS the proof. A bare key claims the artifact runs under ANY
# Linux userland; ubuntu (glibc) + fedora (a different glibc vintage) + alpine
# (musl) is what turns that claim into evidence. Drop alpine and the claim is
# merely asserted.
platforms:
  linux/amd64:
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  linux/arm64:
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "alpine:3.20",  shell: sh }
      - { image: "fedora:40",    shell: bash }
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    runner: windows-11-arm
    shell: pwsh
  # No `darwin/amd64` — upstream ships no Intel Mac asset (see `assets:`).
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

annotations:
  # From the Phase 1.5 license gate. `gh api repos/sharkdp/fd/license` reports
  # only `Apache-2.0` — it picks one file and the repo root carries both
  # LICENSE-APACHE and LICENSE-MIT. Cargo.toml is authoritative:
  #   $ gh api repos/sharkdp/fd/contents/Cargo.toml --jq .content \
  #       | base64 -d | grep '^license'
  #   license = "MIT OR Apache-2.0"
  # Both files ship inside every release archive and are republished with it.
  org.opencontainers.image.licenses: "MIT OR Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: sharkdp/fd
  fork: ocx-contrib/index
